name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-26
    timeout-minutes: 20
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.2.app/Contents/Developer
      ACC_SIGN_IDENTITY: "-"
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Toolchain
        run: swift --version
      - name: Core tests
        run: swift test
      - name: Build and install app
        run: ./scripts/build-app.sh
      - name: Offline CLI workflows
        run: python3 scripts/smoke-test.py
      - name: Verify installed bundle
        run: |
          codesign --verify --deep --strict /Applications/Acc.app
          plutil -lint /Applications/Acc.app/Contents/Info.plist
          cmp dist/Acc.app/Contents/MacOS/AccMenuBar /Applications/Acc.app/Contents/MacOS/AccMenuBar
      - name: Package build
        run: tar -czf dist/Acc-macos-arm64.tar.gz -C dist Acc.app acc
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: Acc-macos-arm64
          path: dist/Acc-macos-arm64.tar.gz
          retention-days: 14
